  fy: 4627.3003725463414
  cx: 2473
  cy: 1643
  width: 4946
  height: 3286
  scale: 1
  near_plane: 0.3
  far_plane: inf
  q_world_to_cam: [0.9015232185173202, -0.071399717394061007, -0.42328970786259285, -0.05462407937733455]
